spring.application.name=DSA-Revision-Dashboard
# Connect to the H2 Database and name it 'dsadb'
spring.datasource.url=jdbc:h2:mem:dsadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable the H2 Console so you can view your database in the browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Tell Hibernate to automatically create/update your database tables based on your Entities
spring.jpa.hibernate.ddl-auto=update

# Show the SQL queries in the terminal (great for learning and debugging!)
spring.jpa.show-sql=true